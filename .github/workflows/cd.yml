name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA to package
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-artifact:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          outputs: type=oci,dest=${{ runner.temp }}/local-llm-router.tar
          tags: local-llm-router:${{ env.RELEASE_REF }}
      - uses: actions/upload-artifact@v7
        with:
          name: local-llm-router-${{ env.RELEASE_REF }}
          path: ${{ runner.temp }}/local-llm-router.tar
          retention-days: 14


  deployment-plan:
    # Renders the deployment topology and the canary plan that names its own
    # rollback target. Applying to a cluster stays disabled until a deployment
    # destination is configured; nothing here contacts a live environment.
    needs: release-artifact
    runs-on: ubuntu-latest
    env:
      RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Verify the serving configuration matches the catalog
        run: python -m llm_router.serving > /tmp/ray-serve.yaml && diff -u config/ray-serve.yaml /tmp/ray-serve.yaml
      - name: Verify the Ray topology matches the catalog
        run: python -m llm_router.topology > /tmp/ray-service.yaml && diff -u deploy/overlays/ray/ray-service.yaml /tmp/ray-service.yaml
      - name: Verify the Helm chart matches the manifests
        run: python -m llm_router.chart --check && helm lint deploy/helm/llm-routing
      - name: Package the Helm chart
        run: helm package deploy/helm/llm-routing --destination chart
      - name: Verify every catalog adapter has a matching recipe
        run: python -m llm_router.adapters check
      - name: Render the canary and rollback plans
        # One plan per track (model, adapter, policy), each naming what it
        # rolls back to and the criteria that trigger it.
        run: python -m llm_router.canary > canary-plan.json
      - name: Render the governance plan
        # What a sync would record in MLflow for this catalog: every model and
        # adapter revision, its stage, and its benchmark evidence. Planned
        # offline; syncing a live MLflow stays disabled with the rest of deploy.
        run: python -m llm_router.governance plan > governance-plan.json
      - name: Validate the Kubernetes manifests
        run: |
          curl -sSLo kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform.tar.gz kubeconform
          # Both topologies are rendered the way they would be applied: the
          # single-engine base, and the Ray overlay that replaces the engine.
          kubectl kustomize deploy/kubernetes > rendered-base.yaml
          kubectl kustomize deploy/overlays/ray > rendered-ray.yaml
          ./kubeconform -strict -ignore-missing-schemas -summary rendered-base.yaml rendered-ray.yaml
      - uses: actions/upload-artifact@v7
        with:
          name: deployment-plan-${{ env.RELEASE_REF }}
          path: |
            canary-plan.json
            governance-plan.json
            config/ray-serve.yaml
            chart
            rendered-base.yaml
            rendered-ray.yaml
            deploy
          retention-days: 14
