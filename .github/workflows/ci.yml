name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy
      - run: pytest tests/unit tests/integration --cov=llm_router --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml

  integration:
    name: Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest tests/integration

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: python -m pip install -e ".[dev]"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  container:
    name: Release image validation
    runs-on: ubuntu-latest
    needs: [unit, integration, e2e]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: local-llm-router:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan the image for known vulnerabilities
        # A release image may not carry a critical or high vulnerability that
        # has a fix. This job gates the merge, and only merges are released.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local-llm-router:${{ github.sha }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Start the image and wait for it to answer
        run: |
          docker run -d --name smoke -p 8000:8000 -e ROUTER_API_KEYS=smoke local-llm-router:${{ github.sha }}
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/healthz; then exit 0; fi
            sleep 1
          done
          docker logs smoke
          exit 1
