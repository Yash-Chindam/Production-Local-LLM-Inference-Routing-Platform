[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-llm-router"
version = "0.1.0"
description = "OpenAI-compatible gateway and policy router for local LLM inference."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.141.1,<1",
  "httpx>=0.28.1,<1",
  "prometheus-client>=0.26.0,<1",
  "pyyaml>=6.0.3,<7",
  "pydantic-settings>=2.15.0,<3",
  "uvicorn[standard]>=0.52.4,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=2.3.1,<3",
  "pytest>=9.1.1,<10",
  "pytest-asyncio>=1.4.0,<2",
  "pytest-cov>=7.1.0,<8",
  "ruff>=0.16.4,<1",
  "types-PyYAML>=6.0.12,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/llm_router"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: tests that exercise multiple application components",
]

[tool.coverage.run]
branch = true
source = ["llm_router"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["llm_router"]

