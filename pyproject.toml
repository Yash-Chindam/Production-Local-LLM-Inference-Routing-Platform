[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-llm-router"
version = "0.1.0"
description = "OpenAI-compatible gateway and policy router for local LLM inference."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.141.1,<1",
  "httpx>=0.28.1,<1",
  "opentelemetry-api>=1.30,<2",
  "prometheus-client>=0.26.0,<1",
  "pyyaml>=6.0.3,<7",
  "pydantic-settings>=2.15.0,<3",
  "uvicorn[standard]>=0.53.0,<1",
]

[project.optional-dependencies]
redis = [
  "redis>=8.1.0,<9",
]
governance = [
  "alembic>=1.13,<2",
  "mlflow-skinny>=3.5,<4",
  "sqlalchemy>=2,<3",
]
tracing = [
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
  "opentelemetry-sdk>=1.30,<2",
]
dev = [
  "alembic>=1.13,<2",
  "mlflow-skinny>=3.5,<4",
  "mypy>=2.3.1,<3",
  "opentelemetry-sdk>=1.30,<2",
  "pytest>=9.1.1,<10",
  "pytest-asyncio>=1.4.0,<2",
  "pytest-cov>=7.1.0,<8",
  "ruff>=0.16.9,<1",
  "sqlalchemy>=2,<3",
  "types-PyYAML>=6.0.12.20260906,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/llm_router"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
  # Raised inside MLflow's own SQLAlchemy models; nothing here can act on it.
  "ignore::sqlalchemy.exc.SADeprecationWarning",
]
markers = [
  "integration: tests that exercise multiple application components",
]

[tool.coverage.run]
branch = true
source = ["llm_router"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["llm_router"]


[[tool.mypy.overrides]]
# The redis extra is optional at runtime and is not installed in the default
# verification environment; the client is used only behind the RedisLike protocol.
module = ["redis.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# MLflow ships in the optional governance extra and is imported lazily, only
# when a tracking URI is given; the client is used behind GovernanceStore.
module = ["mlflow.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# The OTLP exporter ships in the optional tracing extra and is imported lazily,
# only when a collector endpoint is configured.
module = ["opentelemetry.exporter.*"]
ignore_missing_imports = true
