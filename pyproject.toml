[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "local-llm-router"
dynamic = ["version"]
description = "OpenAI-compatible gateway and policy router for local LLM inference."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.141.1,<1",
  "httpx>=0.28.1,<1",
  "opentelemetry-api>=1.30,<2",
  "prometheus-client>=0.26.0,<1",
  "pyyaml>=6.0.3,<7",
  "pydantic-settings>=2.15.0,<3",
  "pyjwt[crypto]>=2.9,<3",
  "uvicorn[standard]>=0.53.0,<1",
]

[project.optional-dependencies]
redis = [
  "redis>=8.1.0,<9",
]
governance = [
  "alembic>=1.20.0,<2",
  "mlflow-skinny>=3.16.1,<4",
  "sqlalchemy>=2.1.1,<3",
]
# Adapter training. Needs a GPU; nothing in the verification environment
# installs it. Unsloth is an alternative trainer, installed separately.
training = [
  "accelerate>=1.15.0",
  "bitsandbytes>=0.50.2",
  "datasets>=5.0.1",
  "peft>=0.21.2",
  "transformers>=5.18.0",
]
unsloth = [
  "unsloth",
]
tracing = [
  "opentelemetry-exporter-otlp-proto-http>=1.45.0,<2",
  "opentelemetry-sdk>=1.45.0,<2",
]
dev = [
  "alembic>=1.20.0,<2",
  "mlflow-skinny>=3.16.1,<4",
  "mypy>=2.4.0,<3",
  "opentelemetry-sdk>=1.45.0,<2",
  "pytest>=9.1.1,<10",
  "pytest-asyncio>=1.4.0,<2",
  "pytest-cov>=7.1.0,<8",
  "ruff>=0.16.10,<1",
  "sqlalchemy>=2.1.1,<3",
  "types-PyYAML>=6.0.12.20260906,<7",
]

# The version is the release tag. Releases are tagged by the release workflow
# after a merge, so no file in the repository has to be edited to cut one.
[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"
# Used when there is no git history to read, as in a source archive.
fallback_version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_router"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
  # Raised inside MLflow's own SQLAlchemy models; nothing here can act on it.
  "ignore::sqlalchemy.exc.SADeprecationWarning",
]
markers = [
  "integration: tests that exercise multiple application components",
]

[tool.coverage.run]
branch = true
source = ["llm_router"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["llm_router"]


[[tool.mypy.overrides]]
# The redis extra is optional at runtime and is not installed in the default
# verification environment; the client is used only behind the RedisLike protocol.
module = ["redis.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# The training stack ships in optional extras and is imported only inside
# the function that trains an adapter.
module = ["datasets.*", "peft.*", "transformers.*", "unsloth.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# MLflow ships in the optional governance extra and is imported lazily, only
# when a tracking URI is given; the client is used behind GovernanceStore.
module = ["mlflow.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# The OTLP exporter ships in the optional tracing extra and is imported lazily,
# only when a collector endpoint is configured.
module = ["opentelemetry.exporter.*"]
ignore_missing_imports = true
