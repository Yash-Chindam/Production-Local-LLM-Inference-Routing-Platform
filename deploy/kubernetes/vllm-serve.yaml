# GPU serving replicas are scheduled onto accelerator-specific pools and scale
# separately from the stateless gateway.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-serve
  namespace: llm-routing
  labels:
    app.kubernetes.io/name: vllm-serve
    app.kubernetes.io/part-of: local-llm-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm-serve
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm-serve
        app.kubernetes.io/part-of: local-llm-router
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-L4
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: engine
          image: docker.io/vllm/vllm-openai@sha256:REPLACE_ME
          args:
            - --served-model-name=small-specialist
            - --enable-prefix-caching
            - --enable-lora
            - --max-model-len=8192
            - --quantization=awq
          ports:
            - name: http
              containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: "4"
              memory: 32Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: 48Gi
              nvidia.com/gpu: "1"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 120
            periodSeconds: 10
      terminationGracePeriodSeconds: 120
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-serve
  namespace: llm-routing
spec:
  selector:
    app.kubernetes.io/name: vllm-serve
  ports:
    - name: http
      port: 8000
      targetPort: http
