# Cache and quota state. Credentials come from the cluster secret manager;
# no secret material is committed to this repository.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: llm-routing
  labels:
    app.kubernetes.io/name: redis
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: docker.io/library/redis@sha256:REPLACE_ME
          ports:
            - name: redis
              containerPort: 6379
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: llm-routing
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llm-gateway-credentials
  namespace: llm-routing
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secret-store
    kind: ClusterSecretStore
  target:
    name: llm-gateway-credentials
  data:
    - secretKey: api-keys
      remoteRef:
        key: llm-routing/gateway
        property: api_keys
    - secretKey: external-provider-key
      remoteRef:
        key: llm-routing/gateway
        property: external_provider_key
