apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-gateway
  namespace: llm-routing
  labels:
    app.kubernetes.io/name: llm-gateway
    app.kubernetes.io/part-of: local-llm-router
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-gateway
        app.kubernetes.io/part-of: local-llm-router
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          # Replaced at deploy time with the digest recorded in the DeploymentRevision.
          image: ghcr.io/REPLACE_ME/local-llm-router@sha256:REPLACE_ME
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: ROUTER_ENVIRONMENT
              value: production
            - name: ROUTER_BACKEND
              value: vllm
            - name: ROUTER_VLLM_BASE_URL
              value: http://vllm-serve.llm-routing.svc.cluster.local:8000
            - name: ROUTER_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: llm-gateway-credentials
                  key: api-keys
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "10"]
      terminationGracePeriodSeconds: 60
---
apiVersion: v1
kind: Service
metadata:
  name: llm-gateway
  namespace: llm-routing
  labels:
    app.kubernetes.io/name: llm-gateway
spec:
  selector:
    app.kubernetes.io/name: llm-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
