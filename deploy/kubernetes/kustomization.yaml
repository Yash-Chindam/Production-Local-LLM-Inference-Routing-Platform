apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: llm-routing
resources:
  - namespace.yaml
  - gateway.yaml
  - autoscaling.yaml
  - vllm-serve.yaml
  - state.yaml
  - network-policy.yaml
  - external-provider.yaml
  - mlflow.yaml
  - observability.yaml
# Grafana's dashboard sidecar loads any ConfigMap carrying this label.
configMapGenerator:
  - name: llm-routing-dashboards
    files:
      - dashboards/gateway.json
      - dashboards/serving.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
