apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: llm-gateway
    app.kubernetes.io/part-of: local-llm-router
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-gateway
        app.kubernetes.io/part-of: local-llm-router
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          # Replaced at deploy time with the digest recorded in the DeploymentRevision.
          image: {{ .Values.images.gateway | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: ROUTER_ENVIRONMENT
              value: production
            - name: ROUTER_BACKEND
              value: vllm
            - name: ROUTER_VLLM_BASE_URL
              value: {{ include "llm-routing.engineUrl" . }}
            # Callers present short-lived tokens from the identity provider.
            # Static API keys are not accepted in the cluster at all. The
            # issuer's public keys come from the secret manager, so verifying
            # a token needs no network path out of the namespace.
            - name: ROUTER_REQUIRE_SHORT_LIVED_CREDENTIALS
              value: "true"
            - name: ROUTER_JWT_ISSUER
              value: {{ .Values.auth.issuer | quote }}
            - name: ROUTER_JWT_AUDIENCE
              value: {{ .Values.auth.audience | quote }}
            - name: ROUTER_JWT_MAX_LIFETIME_SECONDS
              value: "3600"
            - name: ROUTER_JWT_JWKS
              valueFrom:
                secretKeyRef:
                  name: llm-gateway-credentials
                  key: jwt-jwks
            # External fallback stays off until an operator enables it; the
            # proxy address and key are in place so enabling it is one setting.
            - name: ROUTER_EXTERNAL_BASE_URL
              value: http://litellm-proxy.{{ .Release.Namespace }}.svc.cluster.local:4000
            - name: ROUTER_EXTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-gateway-credentials
                  key: external-proxy-key
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "10"]
      terminationGracePeriodSeconds: 60
---
apiVersion: v1
kind: Service
metadata:
  name: llm-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: llm-gateway
spec:
  selector:
    app.kubernetes.io/name: llm-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
