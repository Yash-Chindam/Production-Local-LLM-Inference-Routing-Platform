# The gateway's egress with the Ray Serve pods in place of the single engine.
# A list of egress rules has no merge key, so the whole list is restated.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: llm-gateway
  namespace: llm-routing
spec:
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ray-serve
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm-proxy
      ports:
        - protocol: TCP
          port: 4000
